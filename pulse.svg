<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="Live GitHub pulse">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080B11"/>
      <stop offset="1" stop-color="#0D1118"/>
    </linearGradient>
    <style>
      .ui{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Arial,sans-serif}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      @keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
      .pulse{animation:pulse 2s ease-in-out infinite}
    </style>
  </defs>
  <rect width="1200" height="260" rx="30" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="258" rx="29" fill="none" stroke="#252D39"/>
  <circle cx="58" cy="58" r="5" fill="#62E6A7" class="pulse"/>
  <text x="78" y="64" class="ui" font-size="13" fill="#7A8799" letter-spacing="1.5">LIVE PULSE</text>
  <text x="58" y="126" class="ui" font-size="25" font-weight="650" fill="#EEF3F8">Waiting for the first GitHub Action run.</text>
  <text x="58" y="163" class="mono" font-size="12" fill="#667487">Actions → Update profile pulse → Run workflow</text>
  <text x="58" y="210" class="ui" font-size="12" fill="#566274">After the first run, this card becomes live and refreshes automatically.</text>
</svg>
