# Nome que aparece na lista de workflows na aba Actions
# Mudou para o nome sugerido pela documentação da Action Sutil/snk
name: Generate snake game

# Eventos que disparam a Action
on:
  # Dispara a Action automaticamente todo dia à meia-noite UTC
  # Você pode ajustar o cron, se quiser (esse da documentação roda a cada 12h)
  schedule:
    - cron: "* */12 * * *"
  # Permite rodar a Action manualmente pela aba "Actions"
  workflow_dispatch:

# Definição dos jobs (tarefas)
jobs:
  # Nome do job
  build:
    # Nome do job que aparece nos logs (sugerido pela documentação)
    name: Jobs to update datas
    # Ambiente de execução
    runs-on: ubuntu-latest
    # Permissões para escrever no repositório (necessário para o commit)
    permissions:
      contents: write

    # Passos do job
    steps:
      # Passo 1: Faz o checkout do código do seu repositório no ambiente da Action
      - name: Checkout code
        uses: actions/checkout@v4

      # Passo 2: Roda a Action que gera a animação da cobrinha
      # **USANDO A ACTION Sutil/snk COM PARÂMETROS DE TAMANHO**
      - name: Generate snake file # Este passo gera o arquivo SVG
        uses: Sutil/snk@master # <<< A ACTION CORRETA
        id: snake-gif # ID para referência futura (opcional)
        with:
          # **Seu nome de usuário do GitHub** - Pegando automaticamente do repositório owner
          github_user_name: ${{ github.repository_owner }} # Isso usará 'Pedrinscrk'
          # Caminho onde o SVG/GIF será gerado DENTRO DO AMBIENTE DA ACTION
          # É o caminho que a Action Sutil/snk usa
          svg_out_path: dist/github-contribution-grid-snake2.svg # <<< NOME E CAMINHO DO ARQUIVO GERADO

          # Parâmetro opcional: cor da cobrinha
          snake_color: 'blue' # Ex: 'green', 'red', etc.

          # >>> PARÂMETROS ADICIONADOS PARA CORRIGIR O CONTEÚDO SVG <<<
          width: 480 # <<< LARGURA DA IMAGEM (AJUSTE SE QUISER)
          height: 240 # <<< ALTURA DA IMAGEM (AJUSTE SE QUISER)
          # ^^^ Estes parâmetros provavelmente faltavam para a Action gerar o SVG corretamente

          # Outros parâmetros opcionais da Sutil/snk podem ser adicionados aqui se necessário
          # Veja a documentação completa da Sutil/snk no GitHub (Sutil/snk) se precisar de mais opções

        env:
          # Token de autenticação do GitHub (necessário para a Action Sutil/snk buscar seus dados)
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Passo 3: Usa outra Action para commitar o arquivo gerado para o branch 'output'
      - name: Commit generated file # Este passo commita o arquivo gerado
        # Usando a Action sugerida pela documentação da Sutil/snk para commit
        uses: crazy-max/ghaction-github-pages@v2.1.3
        with:
          # **Branch de destino:** O arquivo será commitado NESTE branch!
          target_branch: output # <<< O ARQUIVO IRÁ PARA UM BRANCH CHAMADO 'output'
          # **Diretório para commitar:** O conteúdo DESTA pasta será commitado (onde a Sutil/snk gerou o arquivo)
          build_dir: dist # <<< COMMITARÁ O CONTEÚDO DA PASTA 'dist'
        env:
          # Token de autenticação do GitHub (necessário para commitar em outro branch)
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
