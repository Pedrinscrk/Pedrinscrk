name: Generate contribution motion

on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * *"

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Pedrinscrk
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%239B7DFF&color_dots=%23161B22,%2321282F,%23303B46,%2349C7FF,%238B7BFF

      - name: Publish output branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          mkdir -p /tmp/profile-motion
          cp dist/*.svg /tmp/profile-motion/

          git switch --orphan output
          git rm -rf . || true
          cp /tmp/profile-motion/*.svg .

          git add .
          git commit -m "chore(profile): refresh contribution motion"
          git push --force origin output
