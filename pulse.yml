name: Update profile pulse

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    paths:
      - "scripts/update_pulse.py"
      - ".github/workflows/pulse.yml"

permissions:
  contents: write

jobs:
  pulse:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate live pulse
        env:
          GH_USER: Pedrinscrk
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_pulse.py

      - name: Commit generated SVG
        run: |
          if git diff --quiet -- assets/pulse.svg; then
            echo "No pulse changes."
            exit 0
          fi

          git config user.name "profile-pulse[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/pulse.svg
          git commit -m "chore(profile): refresh live pulse"
          git push
