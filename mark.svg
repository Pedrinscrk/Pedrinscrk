<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160" role="img" aria-label="Pedrinho mark">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7AA2FF"/>
      <stop offset=".5" stop-color="#9B7CFF"/>
      <stop offset="1" stop-color="#45D7FF"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>
  <rect width="160" height="160" rx="40" fill="#070A0F"/>
  <circle cx="80" cy="80" r="52" fill="none" stroke="#202733" stroke-width="1.5"/>
  <circle cx="80" cy="80" r="43" fill="none" stroke="url(#g)" stroke-width="2" stroke-dasharray="55 18">
    <animateTransform attributeName="transform" type="rotate" from="0 80 80" to="360 80 80" dur="14s" repeatCount="indefinite"/>
  </circle>
  <circle cx="80" cy="80" r="36" fill="url(#g)" opacity=".15" filter="url(#soft)">
    <animate attributeName="opacity" values=".08;.22;.08" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <text x="80" y="94" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="42" font-weight="700" fill="#F7F9FC" letter-spacing="-2">P/</text>
</svg>
