<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-label="Pedrinscrk animated emerald terminal banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#030806"/>
      <stop offset="0.55" stop-color="#07110d"/>
      <stop offset="1" stop-color="#0a2118"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="45%" r="60%">
      <stop offset="0" stop-color="#25c686" stop-opacity=".16"/>
      <stop offset="1" stop-color="#25c686" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#25c686" stop-opacity="0"/>
      <stop offset=".5" stop-color="#39e6a0" stop-opacity=".72"/>
      <stop offset="1" stop-color="#25c686" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#25c686" stroke-opacity=".055"/>
    </pattern>
    <filter id="glow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="bodyclip"><rect x="1" y="43" width="998" height="216" rx="0"/></clipPath>
  </defs>
  <style>
    @keyframes scanY {0%{transform:translateY(-14px);opacity:0}8%{opacity:1}92%{opacity:1}100%{transform:translateY(274px);opacity:0}}
    @keyframes blink {0%,47%{opacity:1}48%,100%{opacity:.08}}
    @keyframes glowPulse {0%,100%{opacity:.35}50%{opacity:1}}
    @keyframes packet {0%{transform:translateX(-140px)}100%{transform:translateX(1140px)}}
    @keyframes glitch {0%,87%,100%{transform:translate(0,0)}88%{transform:translate(-3px,1px)}89%{transform:translate(4px,-1px)}90%{transform:translate(-2px,0)}91%{transform:translate(2px,1px)}92%{transform:translate(0,0)}}
    @keyframes fall1 {from{transform:translateY(-180px)}to{transform:translateY(300px)}}
    @keyframes fall2 {from{transform:translateY(-260px)}to{transform:translateY(300px)}}
    @keyframes breathe {0%,100%{opacity:.24}50%{opacity:.62}}
    .scan{animation:scanY 4.6s linear infinite}
    .cursor{animation:blink .82s steps(1,end) infinite}
    .pulse{animation:glowPulse 2.2s ease-in-out infinite}
    .packet{animation:packet 6.8s linear infinite}
    .packet2{animation:packet 9.3s linear infinite -2.7s}
    .title{animation:glitch 6.4s steps(1,end) infinite}
    .rain1{animation:fall1 8s linear infinite;opacity:.12}
    .rain2{animation:fall2 11s linear infinite -3s;opacity:.09}
    .rain3{animation:fall1 13s linear infinite -6s;opacity:.08}
    .halo{animation:breathe 4.5s ease-in-out infinite}
  </style>

  <rect x="1" y="1" width="998" height="258" rx="18" fill="url(#bg)" stroke="#25c686" stroke-opacity=".42"/>
  <rect x="1" y="1" width="998" height="258" rx="18" fill="url(#grid)"/>
  <rect class="halo" x="1" y="1" width="998" height="258" rx="18" fill="url(#halo)"/>

  <circle cx="28" cy="24" r="5" fill="#ff5f57"/>
  <circle cx="47" cy="24" r="5" fill="#febc2e"/>
  <circle cx="66" cy="24" r="5" fill="#28c840"/>
  <text x="91" y="29" fill="#7c9188" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13">pedro@github: ~/profile</text>
  <text x="956" y="29" text-anchor="end" fill="#25c686" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11">● ONLINE</text>

  <g clip-path="url(#bodyclip)" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#39e6a0">
    <text class="rain1" x="46" y="40">01001101<tspan x="46" dy="16">10110100</tspan><tspan x="46" dy="16">00101101</tspan><tspan x="46" dy="16">11001010</tspan><tspan x="46" dy="16">01011100</tspan><tspan x="46" dy="16">10010110</tspan><tspan x="46" dy="16">01100011</tspan><tspan x="46" dy="16">11010010</tspan></text>
    <text class="rain2" x="886" y="24">11010001<tspan x="886" dy="16">00110110</tspan><tspan x="886" dy="16">10100101</tspan><tspan x="886" dy="16">01011010</tspan><tspan x="886" dy="16">11100010</tspan><tspan x="886" dy="16">00101101</tspan><tspan x="886" dy="16">10011001</tspan><tspan x="886" dy="16">01110100</tspan></text>
    <text class="rain3" x="190" y="10">1010<tspan x="190" dy="16">0110</tspan><tspan x="190" dy="16">1101</tspan><tspan x="190" dy="16">0011</tspan><tspan x="190" dy="16">1011</tspan><tspan x="190" dy="16">0100</tspan></text>
    <text class="rain3" x="792" y="90">0011<tspan x="792" dy="16">1010</tspan><tspan x="792" dy="16">0111</tspan><tspan x="792" dy="16">1100</tspan><tspan x="792" dy="16">0101</tspan></text>
  </g>

  <g class="title" filter="url(#glow)">
    <text x="50%" y="123" text-anchor="middle" fill="#25c686" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="47" font-weight="800" letter-spacing="6">PEDRINSCRK</text>
  </g>
  <text x="50%" y="160" text-anchor="middle" fill="#d7f3e5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" letter-spacing="3">DATA  //  BACKEND  //  AUTOMATION</text>
  <text x="50%" y="194" text-anchor="middle" fill="#799889" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13">$ build --measure --automate --ship</text>
  <rect class="cursor" x="697" y="181" width="8" height="17" rx="1" fill="#39e6a0"/>

  <g transform="translate(0,225)">
    <path d="M28 0H972" stroke="#25c686" stroke-opacity=".17"/>
    <g class="packet"><rect x="0" y="-1" width="105" height="2" rx="1" fill="#25c686"/><circle cx="116" cy="0" r="4" fill="#39e6a0" filter="url(#glow)"/></g>
    <g class="packet2" opacity=".5"><rect x="0" y="-1" width="54" height="2" rx="1" fill="#8ff0c8"/><circle cx="64" cy="0" r="2.6" fill="#8ff0c8"/></g>
  </g>

  <g class="pulse" fill="#25c686"><circle cx="28" cy="241" r="2"/><circle cx="972" cy="241" r="2"/></g>
  <rect class="scan" x="0" y="0" width="1000" height="4" fill="url(#scan)" filter="url(#glow)"/>
</svg>
