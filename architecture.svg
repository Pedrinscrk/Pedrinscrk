<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="Animated data architecture">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080B11"/>
      <stop offset="1" stop-color="#0D1118"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6EA8FF"/>
      <stop offset=".52" stop-color="#9A7BFF"/>
      <stop offset="1" stop-color="#4CE0FF"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .ui{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Arial,sans-serif}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .wire{fill:none;stroke:#303846;stroke-width:2}
      .wire2{fill:none;stroke:url(#flow);stroke-width:2;stroke-dasharray:10 14;animation:dash 7s linear infinite}
      @keyframes dash{to{stroke-dashoffset:-240}}
      @keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
      .pulse{animation:pulse 2.6s ease-in-out infinite}
      .node{fill:#0D131C;stroke:#2A3443;stroke-width:1.2}
      .node2{fill:#111722;stroke:#566783;stroke-width:1.4}
    </style>
  </defs>

  <rect width="1200" height="560" rx="30" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="558" rx="29" fill="none" stroke="#252C37"/>

  <text x="54" y="58" class="ui" font-size="13" fill="#7A8799" letter-spacing="1.6">LIVE DATA ARCHITECTURE</text>
  <text x="54" y="91" class="ui" font-size="23" font-weight="650" fill="#EFF3F8">From fragmented inputs to usable outcomes.</text>

  <path id="p1" d="M170 280 C250 280 265 190 350 190 S455 280 535 280" class="wire"/>
  <path id="p2" d="M170 280 C250 280 265 370 350 370 S455 280 535 280" class="wire"/>
  <path id="p3" d="M535 280 C610 280 620 205 700 205 S790 280 850 280" class="wire"/>
  <path id="p4" d="M535 280 C610 280 620 355 700 355 S790 280 850 280" class="wire"/>
  <path id="p5" d="M850 280 C940 280 955 195 1040 195" class="wire"/>
  <path id="p6" d="M850 280 C940 280 955 365 1040 365" class="wire"/>

  <path d="M170 280 C250 280 265 190 350 190 S455 280 535 280" class="wire2"/>
  <path d="M170 280 C250 280 265 370 350 370 S455 280 535 280" class="wire2" style="animation-delay:-2.2s"/>
  <path d="M535 280 C610 280 620 205 700 205 S790 280 850 280" class="wire2" style="animation-delay:-1s"/>
  <path d="M535 280 C610 280 620 355 700 355 S790 280 850 280" class="wire2" style="animation-delay:-3.7s"/>
  <path d="M850 280 C940 280 955 195 1040 195" class="wire2" style="animation-delay:-2.6s"/>
  <path d="M850 280 C940 280 955 365 1040 365" class="wire2" style="animation-delay:-4.4s"/>

  <g fill="#8FA8FF" filter="url(#glow)">
    <circle r="4"><animateMotion dur="4.4s" repeatCount="indefinite"><mpath href="#p1"/></animateMotion></circle>
    <circle r="4"><animateMotion dur="5.1s" begin="-2s" repeatCount="indefinite"><mpath href="#p2"/></animateMotion></circle>
    <circle r="4" fill="#A789FF"><animateMotion dur="4.3s" begin="-1s" repeatCount="indefinite"><mpath href="#p3"/></animateMotion></circle>
    <circle r="4" fill="#5FE1FF"><animateMotion dur="5s" begin="-3s" repeatCount="indefinite"><mpath href="#p4"/></animateMotion></circle>
    <circle r="4" fill="#6EA8FF"><animateMotion dur="3.8s" begin="-1.7s" repeatCount="indefinite"><mpath href="#p5"/></animateMotion></circle>
    <circle r="4" fill="#A789FF"><animateMotion dur="4.6s" begin="-2.8s" repeatCount="indefinite"><mpath href="#p6"/></animateMotion></circle>
  </g>

  <g transform="translate(70 235)">
    <rect width="100" height="90" rx="22" class="node"/>
    <text x="50" y="38" text-anchor="middle" class="ui" font-size="14" fill="#EAF0F7">SOURCES</text>
    <text x="50" y="61" text-anchor="middle" class="mono" font-size="10" fill="#667487">systems</text>
    <circle cx="84" cy="16" r="4" fill="#62E6A7" class="pulse"/>
  </g>

  <g transform="translate(300 145)">
    <rect width="100" height="90" rx="22" class="node"/>
    <text x="50" y="38" text-anchor="middle" class="ui" font-size="14" fill="#EAF0F7">API</text>
    <text x="50" y="61" text-anchor="middle" class="mono" font-size="10" fill="#667487">contracts</text>
  </g>

  <g transform="translate(300 325)">
    <rect width="100" height="90" rx="22" class="node"/>
    <text x="50" y="38" text-anchor="middle" class="ui" font-size="14" fill="#EAF0F7">ETL</text>
    <text x="50" y="61" text-anchor="middle" class="mono" font-size="10" fill="#667487">transform</text>
  </g>

  <g transform="translate(480 225)">
    <rect width="110" height="110" rx="28" class="node2"/>
    <circle cx="55" cy="44" r="14" fill="#8E7CFF" opacity=".18"/>
    <circle cx="55" cy="44" r="7" fill="#8E7CFF" class="pulse"/>
    <text x="55" y="77" text-anchor="middle" class="ui" font-size="14" font-weight="650" fill="#F5F7FB">RULES</text>
    <text x="55" y="95" text-anchor="middle" class="mono" font-size="9" fill="#77859A">business logic</text>
  </g>

  <g transform="translate(650 160)">
    <rect width="100" height="90" rx="22" class="node"/>
    <text x="50" y="38" text-anchor="middle" class="ui" font-size="14" fill="#EAF0F7">JOBS</text>
    <text x="50" y="61" text-anchor="middle" class="mono" font-size="10" fill="#667487">schedule</text>
  </g>

  <g transform="translate(650 310)">
    <rect width="100" height="90" rx="22" class="node"/>
    <text x="50" y="38" text-anchor="middle" class="ui" font-size="14" fill="#EAF0F7">EVENTS</text>
    <text x="50" y="61" text-anchor="middle" class="mono" font-size="10" fill="#667487">trigger</text>
  </g>

  <g transform="translate(795 225)">
    <rect width="110" height="110" rx="28" class="node2"/>
    <circle cx="55" cy="44" r="14" fill="#43D9FF" opacity=".16"/>
    <circle cx="55" cy="44" r="7" fill="#43D9FF" class="pulse"/>
    <text x="55" y="77" text-anchor="middle" class="ui" font-size="14" font-weight="650" fill="#F5F7FB">ORCHESTRATE</text>
    <text x="55" y="95" text-anchor="middle" class="mono" font-size="9" fill="#77859A">run safely</text>
  </g>

  <g transform="translate(1010 150)">
    <rect width="130" height="90" rx="22" class="node"/>
    <text x="65" y="38" text-anchor="middle" class="ui" font-size="14" fill="#EAF0F7">DATA PRODUCTS</text>
    <text x="65" y="61" text-anchor="middle" class="mono" font-size="10" fill="#667487">usable output</text>
  </g>

  <g transform="translate(1010 320)">
    <rect width="130" height="90" rx="22" class="node"/>
    <text x="65" y="38" text-anchor="middle" class="ui" font-size="14" fill="#EAF0F7">PRODUCT UX</text>
    <text x="65" y="61" text-anchor="middle" class="mono" font-size="10" fill="#667487">clear surface</text>
  </g>

  <g transform="translate(54 486)">
    <rect width="1092" height="34" rx="12" fill="#0A0E14" stroke="#222A35"/>
    <circle cx="18" cy="17" r="4" fill="#62E6A7" class="pulse"/>
    <text x="34" y="22" class="mono" font-size="10" fill="#6F7D91">FLOW STATUS</text>
    <text x="150" y="22" class="mono" font-size="10" fill="#B6C0CE">DATA</text>
    <text x="202" y="22" class="mono" font-size="10" fill="#62E6A7">SYNCED</text>
    <text x="302" y="22" class="mono" font-size="10" fill="#B6C0CE">AUTOMATION</text>
    <text x="385" y="22" class="mono" font-size="10" fill="#62E6A7">RUNNING</text>
    <text x="490" y="22" class="mono" font-size="10" fill="#B6C0CE">UX</text>
    <text x="518" y="22" class="mono" font-size="10" fill="#62E6A7">READY</text>
    <text x="650" y="22" class="mono" font-size="10" fill="#566274">complex underneath · clear on the surface</text>
  </g>
</svg>
